<!doctype html><meta charset=utf-8><title>Tiên Đồ Vô Tận — cửa động</title>
<style>body{background:#0e1621;color:#e9eef4;font:15px/1.6 system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0;text-align:center}a{color:#e3b562}</style>
<body><div id=x>Đang lần lối vào động…</div><script>\nvar duong = location.pathname.replace(/[^\/]*$/,"");\nfetch(duong+"mini.json?t="+Date.now(),{cache:"no-store"})\n.then(function(r){return r.json()})\n.then(function(d){if(d&&d.url){location.replace(d.url)}else{document.getElementById("x").innerHTML="Cửa động đang khép — lượt trực sau sẽ mở lại."}})\n.catch(function(){document.getElementById("x").innerHTML="Chưa có cửa — có lẽ Pages chưa bật, hoặc phiên trực đang nhóm lửa.";});\n</script></body>
